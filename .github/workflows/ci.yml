name: CI
# Fresh verification trigger after authoritative requirements.txt publication.
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies from authoritative lock
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements.txt
      - name: Install developer and CI dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Dependency environment consistency
        run: python -m pip check
      - name: Compile Python files
        run: python -m compileall -q app.py config src pages tests scripts
      - name: Lint
        run: ruff check app.py config src pages tests scripts
      - name: Tests
        run: PYTHONPATH=. pytest -q
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt
      - name: Production FAISS reproducibility diagnostic (uncaptured)
        run: PYTHONPATH=. pytest -s -q tests/test_production_artifact_reproducibility.py
      - name: Build current-pin constraints excluding explicit networkx pin
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path("requirements.txt").read_text().splitlines()
          out = []
          skip = False
          for line in lines:
              if line.startswith("networkx=="):
                  skip = True
                  continue
              if skip:
                  if line.startswith("    ") or line.strip() == "":
                      continue
                  skip = False
              out.append(line)
          Path("/tmp/current-pins.txt").write_text("\n".join(out) + "\n")
          PY
      - name: Reproducible dependency resolution check
        run: |
          pip-compile --quiet --generate-hashes             --constraint=/tmp/current-pins.txt             --output-file=/tmp/requirements.lock             requirements.in
      - name: Validate constrained lock policy
        run: |
          grep -q '^networkx==3.4.2 \\' /tmp/requirements.lock
          grep -q '^multidict==6.9.1 \\' /tmp/requirements.lock
          test "$(grep -c '^    --hash=sha256:' /tmp/requirements.lock)" -gt 0
          python - <<'PY'
          import re
          from pathlib import Path
          lock = Path("/tmp/requirements.lock").read_text()
          m = re.search(r'(?ms)^multidict==6\.9\.1 \\\n(.*?)(?=^\S)', lock)
          assert m and len(re.findall(r'--hash=sha256:', m.group(1))) >= 2
          PY
      - name: Publish constrained authoritative lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-requirements-lock-constrained
          path: /tmp/requirements.lock
          if-no-files-found: error
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies from authoritative lock
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: AUTH-01 mandatory gate
        run: PYTHONPATH=. pytest -q tests/test_auth.py
  config-security:
    name: CONFIG-SEC-01 production configuration security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies from authoritative lock
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: CONFIG-SEC-01 mandatory gate
        run: PYTHONPATH=. pytest -q tests/test_config_security.py
  rag-security:
    name: RAG-SEC-01 prompt injection security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies from authoritative lock
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: RAG-SEC-01 mandatory gate
        run: PYTHONPATH=. pytest -q tests/test_prompt_injection_security.py
  llm-resilience:
    name: LLM-RES-01 LLM resilience and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies from authoritative lock
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: LLM-RES-01 mandatory gate
        run: PYTHONPATH=. pytest -q tests/test_llm_resilience.py
  deploy-readiness:
    name: DEPLOY-HEALTH-01 deployment and health readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies from authoritative lock
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: DEPLOY-HEALTH-01 mandatory gate
        run: PYTHONPATH=. pytest -q tests/test_deployment_readiness.py
      - name: Validate Dockerfile syntax and deployment contract
        run: |
          test -f Dockerfile
          grep -q 'HEALTHCHECK' Dockerfile
          grep -q 'USER app' Dockerfile
          grep -q 'EXPOSE 8502' Dockerfile
  obs-privacy:
    name: OBS-PRIV-01 logging privacy and audit safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies from authoritative lock
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: OBS-PRIV-01 mandatory gate
        run: PYTHONPATH=. pytest -q tests/test_logging_privacy.py
  startup-resilience:
    name: STARTUP-RES-01 startup and dependency resilience
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies from authoritative lock
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: STARTUP-RES-01 mandatory gate
        run: PYTHONPATH=. pytest -q tests/test_startup_resilience.py
  integration:
    name: INTEGRATION-01 Part3 artifact handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies from authoritative lock
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: INTEGRATION-01 mandatory gate
        run: PYTHONPATH=. pytest -q tests/test_integration.py
  final-production-readiness:
    name: FINAL-PROD-01 production readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies from authoritative lock
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: FINAL-PROD-01 mandatory gate
        run: PYTHONPATH=. pytest -q tests/test_final_production_readiness.py
  python-compatibility:
    name: Python compatibility (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.in
      - name: Resolve and install production dependencies for this interpreter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.in
      - name: Install developer and CI dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Dependency environment consistency
        run: python -m pip check
      - name: Compile Python files
        run: python -m compileall -q app.py config src pages tests scripts
      - name: Tests
        run: PYTHONPATH=. pytest -q
      - name: Dependency vulnerability audit
        run: python -m pip_audit
  candidate-transformers-5-15-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-validation-5.15.1.txt
      - name: Install candidate and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation-5.15.1.txt
          python -m pip install pip-audit pipdeptree
      - name: Resolver and environment consistency
        run: |
          python -m pip check
          python -m pip freeze --all | tee /tmp/pip-freeze.txt
          python -m pip inspect --local > /tmp/pip-inspect.json
          python -m pipdeptree --warn fail > /tmp/pipdeptree.txt
      - name: Dependency vulnerability audit
        run: python -m pip_audit --local --format columns
      - name: Publish exact resolved graph
        uses: actions/upload-artifact@v4
        with:
          name: transformers-5.15.1-resolved-graph
          path: |
            /tmp/pip-freeze.txt
            /tmp/pip-inspect.json
            /tmp/pipdeptree.txt
