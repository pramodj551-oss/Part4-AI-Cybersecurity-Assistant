name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.in

      - name: Generate authoritative hashed lock candidate
        run: |
          python -m pip install --upgrade pip pip-tools==7.4.1
          python -m piptools compile --generate-hashes --output-file=/tmp/requirements.txt requirements.in

      - name: Publish generated lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: production-requirements-lock
          path: /tmp/requirements.txt

      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q app.py config src pages tests

      - name: Lint
        run: ruff check app.py config src pages tests

      - name: Tests
        run: PYTHONPATH=. pytest -q

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt

      - name: Reproducible dependency resolution check
        run: pip-compile --quiet --generate-hashes --output-file=/tmp/requirements.lock requirements.in
