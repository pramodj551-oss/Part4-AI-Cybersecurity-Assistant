name: CI

# Fresh verification trigger after authoritative requirements.txt publication.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install production dependencies from authoritative lock
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements.txt

      - name: Install developer and CI dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Dependency environment consistency
        run: python -m pip check

      - name: Compile Python files
        run: python -m compileall -q app.py config src pages tests

      - name: Lint
        run: ruff check app.py config src pages tests

      - name: Tests
        run: PYTHONPATH=. pytest -q

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt

      - name: Reproducible dependency resolution check
        run: pip-compile --quiet --generate-hashes --allow-unsafe --output-file=/tmp/requirements.lock requirements.in

      - name: Publish generated authoritative lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-requirements-lock
          path: /tmp/requirements.lock
          if-no-files-found: error

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install production dependencies from authoritative lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt

      - name: Install developer and CI dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Dependency environment consistency
        run: python -m pip check

      - name: Compile Python files
        run: python -m compileall -q app.py config src pages tests

      - name: Tests
        run: PYTHONPATH=. pytest -q

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt

  candidate-transformers-5-15-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-validation-5.15.1.txt

      - name: Install candidate and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation-5.15.1.txt
          python -m pip install pip-audit pipdeptree

      - name: Resolver and environment consistency
        run: |
          python -m pip check
          python -m pip freeze --all | tee /tmp/pip-freeze.txt
          python -m pip inspect --local > /tmp/pip-inspect.json
          python -m pipdeptree --warn fail > /tmp/pipdeptree.txt

      - name: Dependency vulnerability audit
        run: python -m pip_audit --local --format columns

      - name: Publish exact resolved graph
        uses: actions/upload-artifact@v4
        with:
          name: transformers-5.15.1-resolved-graph
          path: |
            /tmp/pip-freeze.txt
            /tmp/pip-inspect.json
            /tmp/pipdeptree.txt
