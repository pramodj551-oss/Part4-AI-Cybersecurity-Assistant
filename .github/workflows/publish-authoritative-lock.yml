name: Publish authoritative requirements lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-authoritative-lock.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact lock artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_SHA256: sha256:638500f1e80bac089089127f01affc6a62a17a8bdda51e9d7d53d23279112480
          EXPECTED_LOCK_SHA256: 8c79efcc4dbc258c8f31148b0a87563fcad3a1b546473d7c6b92fb3c86019f32
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' /repos/${{ github.repository }}/actions/artifacts/9935270850/zip > /tmp/authoritative-requirements-lock.zip
          actual_zip_sha="sha256:$(sha256sum /tmp/authoritative-requirements-lock.zip | cut -d' ' -f1)"
          test "$actual_zip_sha" = "$EXPECTED_ARTIFACT_SHA256"
          unzip -q /tmp/authoritative-requirements-lock.zip -d /tmp/authoritative-lock
          test "$(find /tmp/authoritative-lock -type f | wc -l)" -eq 1
          test -f /tmp/authoritative-lock/requirements.lock
          actual_lock_sha="$(sha256sum /tmp/authoritative-lock/requirements.lock | cut -d' ' -f1)"
          test "$actual_lock_sha" = "$EXPECTED_LOCK_SHA256"
          test "$(wc -l < /tmp/authoritative-lock/requirements.lock)" -eq 3285
          cp /tmp/authoritative-lock/requirements.lock requirements.txt

      - name: Verify repository file bytes and commit exact artifact
        env:
          EXPECTED_LOCK_SHA256: 8c79efcc4dbc258c8f31148b0a87563fcad3a1b546473d7c6b92fb3c86019f32
        run: |
          set -euo pipefail
          actual_sha="$(sha256sum requirements.txt | cut -d' ' -f1)"
          test "$actual_sha" = "$EXPECTED_LOCK_SHA256"
          test "$(wc -l < requirements.txt)" -eq 3285
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.txt
          git rm .github/workflows/publish-authoritative-lock.yml
          git commit -m 'deps: publish authoritative hashed requirements lock'
          git push origin HEAD:main
