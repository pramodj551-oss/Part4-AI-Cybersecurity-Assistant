name: Generate production lock

on:
  push:
    branches: ["feature/p0-p1-production-hardening"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-tools
        run: python -m pip install --upgrade pip pip-tools==7.6.1

      - name: Generate authoritative hashed lock
        run: python -m piptools compile --generate-hashes --output-file=/tmp/requirements.txt requirements.in

      - name: Verify lock is fully pinned and hashed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/requirements.txt')
          text = p.read_text()
          requirements = [line.strip() for line in text.splitlines()
                          if line.strip() and not line.startswith('#') and not line.startswith('--')]
          bad = [line for line in requirements if '==' not in line or '--hash=sha256:' not in line]
          if bad:
              raise SystemExit('Unpinned or unhashed requirement(s):\n' + '\n'.join(bad))
          print(f'validated {len(requirements)} fully pinned/hashed requirements')
          PY

      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: production-requirements-lock
          path: /tmp/requirements.txt
