version: '3.8'

# =============================================================================
# Docker Compose Configuration
# Multi-container orchestration for all 4 cybersecurity components
# =============================================================================

services:

  # ===========================================================================
  # Part 1: Cybersecurity Data Pipeline
  # ===========================================================================
  
  part1-data-pipeline:
    build:
      context: ../Part1-Cybersecurity-Data-Pipeline
      dockerfile: Dockerfile
    container_name: cyber-data-pipeline
    image: cyber-data-pipeline:latest
    
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_OUTPUT_PATH=/data
      - DATABASE_PATH=/data/security.db
      - LOG_LEVEL=INFO
    
    volumes:
      - shared_data:/data
      - pipeline_logs:/logs
    
    ports:
      - "8000:8000"  # API port (if applicable)
    
    networks:
      - cybersecurity-network
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/data/security.db')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    command: python main.py
    
    depends_on:
      - postgres-db

  # ===========================================================================
  # Part 2: Cybersecurity ML Pipeline
  # ===========================================================================
  
  part2-ml-pipeline:
    build:
      context: ../Part2-Cybersecurity-ML-Pipeline
      dockerfile: Dockerfile
    container_name: cyber-ml-pipeline
    image: cyber-ml-pipeline:latest
    
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_PATH=/data
      - MODEL_OUTPUT_PATH=/models
      - LOG_LEVEL=INFO
      - CUDA_VISIBLE_DEVICES=0  # GPU support (if available)
    
    volumes:
      - shared_data:/data
      - shared_models:/models
      - ml_pipeline_logs:/logs
      - ml_cache:/root/.cache  # HuggingFace cache
    
    ports:
      - "8001:8001"  # API port (if applicable)
    
    networks:
      - cybersecurity-network
    
    restart: unless-stopped
    
    depends_on:
      part1-data-pipeline:
        condition: service_healthy
    
    # GPU support (uncomment if using NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [compute, utility]
    
    command: python train.py
    
    healthcheck:
      test: ["CMD", "python", "-c", "import joblib; joblib.load('/models/trained_model.pkl')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # Part 3: Cybersecurity Dashboard
  # ===========================================================================
  
  part3-dashboard:
    build:
      context: ../Part3-Cybersecurity-Dashboard
      dockerfile: Dockerfile
    container_name: cyber-dashboard
    image: cyber-dashboard:latest
    
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - DATA_PATH=/data
      - MODEL_PATH=/models
      - LOG_LEVEL=INFO
    
    volumes:
      - shared_data:/data
      - shared_models:/models
      - dashboard_logs:/logs
      - ./config/.streamlit:/root/.streamlit
    
    ports:
      - "8501:8501"  # Streamlit dashboard
    
    networks:
      - cybersecurity-network
    
    restart: unless-stopped
    
    depends_on:
      part2-ml-pipeline:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    command: streamlit run app.py --server.maxUploadSize=1024

  # ===========================================================================
  # Part 4: AI Cybersecurity Assistant (RAG)
  # ===========================================================================
  
  part4-rag-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber-rag-assistant
    image: cyber-rag-assistant:latest
    
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8502
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - DATA_PATH=/data
      - MODEL_PATH=/models
      - VECTORSTORE_PATH=/vectorstore
      - OLLAMA_API_BASE=http://ollama:11434
      - LOG_LEVEL=INFO
    
    volumes:
      - shared_data:/data
      - shared_models:/models
      - ./vectorstore:/vectorstore
      - ./config:/config
      - rag_logs:/logs
      - ./config/.streamlit:/root/.streamlit
    
    ports:
      - "8502:8502"  # Streamlit RAG assistant
    
    networks:
      - cybersecurity-network
    
    restart: unless-stopped
    
    depends_on:
      part1-data-pipeline:
        condition: service_healthy
      part2-ml-pipeline:
        condition: service_healthy
      ollama:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    command: streamlit run app.py --server.maxUploadSize=1024

  # ===========================================================================
  # Ollama: Local LLM Server
  # ===========================================================================
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    
    volumes:
      - ollama_data:/root/.ollama
      - ollama_models:/models
    
    ports:
      - "11434:11434"  # Ollama API
    
    networks:
      - cybersecurity-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Pre-pull model on startup (customize model name)
    command: sh -c "ollama pull llama2 && ollama serve"

  # ===========================================================================
  # PostgreSQL Database (Optional)
  # ===========================================================================
  
  postgres-db:
    image: postgres:15-alpine
    container_name: cybersecurity-postgres
    
    environment:
      - POSTGRES_USER=cybersec_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cybersec_password}
      - POSTGRES_DB=cybersecurity_db
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    
    ports:
      - "5432:5432"
    
    networks:
      - cybersecurity-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersec_user -d cybersecurity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # Redis Cache (Optional)
  # ===========================================================================
  
  redis-cache:
    image: redis:7-alpine
    container_name: cybersecurity-redis
    
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    
    volumes:
      - redis_data:/data
    
    ports:
      - "6379:6379"
    
    networks:
      - cybersecurity-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # Prometheus Monitoring (Optional)
  # ===========================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: cybersecurity-prometheus
    
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    
    ports:
      - "9090:9090"
    
    networks:
      - cybersecurity-network
    
    restart: unless-stopped
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    
    depends_on:
      - part1-data-pipeline
      - part2-ml-pipeline
      - part3-dashboard
      - part4-rag-assistant

  # ===========================================================================
  # Grafana Dashboard Visualization (Optional)
  # ===========================================================================
  
  grafana:
    image: grafana/grafana:latest
    container_name: cybersecurity-grafana
    
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    
    ports:
      - "3000:3000"
    
    networks:
      - cybersecurity-network
    
    restart: unless-stopped
    
    depends_on:
      - prometheus

# =============================================================================
# Networks
# =============================================================================

networks:
  cybersecurity-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================

volumes:
  shared_data:
    driver: local
  shared_models:
    driver: local
  ollama_data:
    driver: local
  ollama_models:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pipeline_logs:
    driver: local
  ml_pipeline_logs:
    driver: local
  dashboard_logs:
    driver: local
  rag_logs:
    driver: local
  ml_cache:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
